<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- card bg -->
  <rect x="0" y="0" width="900" height="1000" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="999" rx="15.5" fill="none" stroke="#e5e7eb"/>

  <!-- header -->
  <path d="M0,16 a16,16 0 0 1 16,-16 h868 a16,16 0 0 1 16,16 v230 h-900 z" fill="#065f46"/>

  <text x="64" y="70" font-size="13" letter-spacing="4" fill="#6ee7b7">STUDENT RESUME</text>
  <text x="64" y="128" font-size="46" font-weight="700" fill="#ffffff">Your Name</text>
  <text x="64" y="164" font-size="16" fill="#d1fae5">Education &#8226; Skills &#8226; Career</text>

  <text x="64" y="212" font-size="15" fill="#d1fae5">&#9993; your@email.com</text>
  <text x="260" y="212" font-size="15" fill="#d1fae5">&#9742; 9876543210</text>

  <!-- ABOUT ME -->
  <rect x="64" y="270" width="7" height="26" rx="3.5" fill="#059669"/>
  <text x="88" y="291" font-size="21" font-weight="700" fill="#1f2937">About Me</text>
  <text x="64" y="330" font-size="15" fill="#4b5563">
    <tspan x="64" dy="0">Write something about yourself. Mention your educational</tspan>
    <tspan x="64" dy="24">background, interests and career goals.</tspan>
  </text>

  <!-- EDUCATION -->
  <rect x="64" y="415" width="7" height="26" rx="3.5" fill="#059669"/>
  <text x="88" y="436" font-size="21" font-weight="700" fill="#1f2937">Education</text>

  <line x1="76" y1="465" x2="76" y2="565" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="88" y="470" width="748" height="95" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="110" y="500" font-size="16" font-weight="700" fill="#1f2937">Educational Background</text>
  <text x="110" y="528" font-size="15" fill="#4b5563">Your education details will appear here.</text>

  <!-- SKILLS -->
  <rect x="64" y="618" width="7" height="26" rx="3.5" fill="#059669"/>
  <text x="88" y="639" font-size="21" font-weight="700" fill="#1f2937">Skills</text>

  <g font-size="14" font-weight="700" fill="#047857">
    <rect x="64" y="668" width="76" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="82" y="692">HTML</text>

    <rect x="150" y="668" width="70" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="167" y="692">CSS</text>

    <rect x="230" y="668" width="126" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="248" y="692">JavaScript</text>

    <rect x="366" y="668" width="86" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="386" y="692">React</text>
  </g>

  <!-- HOBBIES -->
  <rect x="64" y="758" width="7" height="26" rx="3.5" fill="#059669"/>
  <text x="88" y="779" font-size="21" font-weight="700" fill="#1f2937">Hobbies &amp; Interests</text>

  <rect x="64" y="808" width="772" height="76" rx="12" fill="#f9fafb" stroke="#f3f4f6"/>
  <text x="88" y="852" font-size="15" fill="#4b5563">Reading, Travelling, Music, Sports&#8230;</text>
</svg>
