<svg viewBox="0 0 620 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="620" height="780" fill="#ffffff"/>

  <!-- Name + title -->
  <text x="0" y="55" font-size="42" font-weight="700" letter-spacing="1" fill="#111111">YOUR NAME</text>
  <text x="0" y="85" font-size="17" fill="#6b6b6b">Professional Position</text>

  <!-- Photo box -->
  <rect x="500" y="10" width="96" height="96" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="548" y="62" font-size="11" letter-spacing="1" fill="#999999" text-anchor="middle">PHOTO</text>

  <!-- Contact bar -->
  <line x1="0" y1="140" x2="620" y2="140" stroke="#d9d9d9" stroke-width="1"/>
  <text x="0" y="168" font-size="14" fill="#6b6b6b">your@email.com</text>
  <text x="150" y="168" font-size="14" fill="#6b6b6b">+91 9876543210</text>
  <line x1="0" y1="190" x2="620" y2="190" stroke="#d9d9d9" stroke-width="1"/>

  <!-- Profile -->
  <text x="0" y="228" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">PROFILE</text>
  <line x1="90" y1="223" x2="620" y2="223" stroke="#854F0B" stroke-width="1"/>
  <text x="0" y="255" font-size="15" fill="#6b6b6b">
    <tspan x="0" dy="0">Your professional summary will appear here. Add information about your</tspan>
    <tspan x="0" dy="24">professional background, strengths and career goals.</tspan>
  </text>

  <!-- Experience -->
  <text x="0" y="335" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">EXPERIENCE</text>
  <line x1="112" y1="330" x2="620" y2="330" stroke="#BA7517" stroke-width="1"/>
  <line x1="0" y1="350" x2="0" y2="382" stroke="#EF9F27" stroke-width="2"/>
  <text x="18" y="370" font-size="15" fill="#6b6b6b">Your professional work experience will appear here.</text>

  <!-- Education -->
  <text x="0" y="428" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">EDUCATION</text>
  <line x1="108" y1="423" x2="620" y2="423" stroke="#BA7517" stroke-width="1"/>
  <text x="0" y="455" font-size="15" fill="#6b6b6b">Your education details will appear here.</text>

  <!-- Skills -->
  <text x="0" y="505" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">SKILLS</text>
  <line x1="72" y1="500" x2="620" y2="500" stroke="#BA7517" stroke-width="1"/>
  <text x="0" y="532" font-size="15" fill="#999999">Your skills</text>

  <!-- Interests -->
  <text x="0" y="582" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">INTERESTS</text>
  <line x1="106" y1="577" x2="620" y2="577" stroke="#c9c9c9" stroke-width="1"/>
  <text x="0" y="609" font-size="15" fill="#6b6b6b">Reading &#8226; Travelling &#8226; Music</text>
</svg>
